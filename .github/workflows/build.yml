name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore WindowsRouteManager.slnx
      - name: Check formatting
        run: dotnet format WindowsRouteManager.slnx --no-restore --verify-no-changes
      - name: Build
        run: dotnet build WindowsRouteManager.slnx -c Release --no-restore
      - name: Test with fake networking only
        run: dotnet test WindowsRouteManager.slnx -c Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Publish self-contained single-file x64
        run: dotnet publish WindowsRouteManager.csproj -c Release -o artifacts/win-x64
      - name: Verify single-file output and prepare artifacts
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath artifacts/win-x64 -Force)
          if ($files.Count -ne 1 -or $files[0].PSIsContainer -or $files[0].Name -cne 'WindowsRouteManager.exe') {
            throw 'Publish must produce only WindowsRouteManager.exe.'
          }
          $hash = (Get-FileHash -LiteralPath artifacts/win-x64/WindowsRouteManager.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WindowsRouteManager.exe" | Set-Content artifacts/win-x64/WindowsRouteManager.exe.sha256
          Copy-Item -LiteralPath README.md, LICENSE -Destination artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsRouteManager-win-x64
          path: |
            artifacts/win-x64/WindowsRouteManager.exe
            artifacts/win-x64/WindowsRouteManager.exe.sha256
            artifacts/win-x64/README.md
            artifacts/win-x64/LICENSE
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_DRAFT_RELEASES == 'true'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: WindowsRouteManager-win-x64
          path: artifacts
      - name: Create optional draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $project = [xml](Get-Content WindowsRouteManager.csproj)
          $expectedTag = 'v' + $project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -cne $expectedTag) { throw "Tag must match project version: $expectedTag" }
          gh release create $env:RELEASE_TAG artifacts/WindowsRouteManager.exe artifacts/WindowsRouteManager.exe.sha256 artifacts/README.md artifacts/LICENSE --verify-tag --draft --title "Windows Route Manager $env:RELEASE_TAG" --notes-file docs/RELEASING.md
