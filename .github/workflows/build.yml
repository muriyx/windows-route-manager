name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore WindowsRouteManager.slnx
      - name: Check formatting
        run: dotnet format WindowsRouteManager.slnx --no-restore --verify-no-changes
      - name: Build
        run: dotnet build WindowsRouteManager.slnx -c Release --no-restore
      - name: Test with fake networking only
        run: dotnet test WindowsRouteManager.slnx -c Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Publish framework-dependent x64
        run: dotnet publish WindowsRouteManager.csproj -c Release -r win-x64 --self-contained false -o artifacts/win-x64
      - name: Package
        shell: pwsh
        run: |
          Copy-Item -LiteralPath README.md, LICENSE -Destination artifacts/win-x64
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/WindowsRouteManager-win-x64.zip
          $hash = (Get-FileHash artifacts/WindowsRouteManager-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WindowsRouteManager-win-x64.zip" | Set-Content artifacts/WindowsRouteManager-win-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsRouteManager-win-x64
          path: |
            artifacts/WindowsRouteManager-win-x64.zip
            artifacts/WindowsRouteManager-win-x64.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_DRAFT_RELEASES == 'true'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: WindowsRouteManager-win-x64
          path: artifacts
      - name: Create optional draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $project = [xml](Get-Content WindowsRouteManager.csproj)
          $expectedTag = 'v' + $project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -cne $expectedTag) { throw "Tag must match project version: $expectedTag" }
          gh release create $env:RELEASE_TAG artifacts/WindowsRouteManager-win-x64.zip artifacts/WindowsRouteManager-win-x64.zip.sha256 --verify-tag --draft --title "Windows Route Manager $env:RELEASE_TAG" --notes-file docs/RELEASING.md
